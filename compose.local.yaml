# Local overlay: Mailpit catches every email sent by SuiteCRM, nothing leaves
# the machine. Inbox on https://mail-<APP_HOST> (mail-suitecrm-core.dev.localhost),
# without a password. One level only under dev.localhost: the local certificate
# covers *.dev.localhost, not *.suitecrm-core.dev.localhost.

services:
  app:
    environment:
      # Written to the database at install and at each start (scripts/mail.php):
      # the schedulers (campaigns, reminders) read it there too.
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      MAIL_FROM_ADDRESS: crm@${APP_HOST}

  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: ${APP_SLUG}-mailpit
    restart: unless-stopped
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      - traefik.http.routers.${APP_SLUG}-mail.rule=Host(`mail-${APP_HOST}`)
      - traefik.http.routers.${APP_SLUG}-mail.entrypoints=websecure
      - traefik.http.services.${APP_SLUG}-mail.loadbalancer.server.port=8025
