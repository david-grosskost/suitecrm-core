# SuiteCRM: app served through the reverse proxy, schedulers, private MariaDB.
# @usage make app@start
name: ${APP_SLUG}

# Shared by app and cron: same image, same application volume.
x-suitecrm: &suitecrm
  build:
    context: .
    dockerfile: .docker/Dockerfile
    target: base
  image: suitecrm-core:dev
  restart: unless-stopped
  volumes:
    - app:/var/www/html

services:
  app:
    <<: *suitecrm
    container_name: ${APP_SLUG}-app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Healthy once the entrypoint has synced the code into the volume.
      test: ["CMD", "test", "-f", "/var/www/html/.image-version"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      - traefik.http.routers.${APP_SLUG}.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.${APP_SLUG}.entrypoints=websecure

  cron:
    <<: *suitecrm
    container_name: ${APP_SLUG}-cron
    # Not the app entrypoint: the code sync is the app's job, not the cron's.
    entrypoint: ["suitecrm-cron"]
    command: []
    user: www-data
    depends_on:
      app:
        condition: service_healthy
    networks:
      - default

  db:
    image: mariadb:11.8
    container_name: ${APP_SLUG}-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app:
  db:

networks:
  proxy:
    name: proxy
    external: true
