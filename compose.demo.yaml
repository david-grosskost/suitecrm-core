# Server overlay, demo environment (demo-<slug>): runs the image published on
# GHCR, never builds it. APP_VERSION is written to .env.local by each deployment.
# Data lives in the instance directory (/srv/suitecrm/<slug>/data), not in
# Docker volumes: one instance = one directory, backed up with it.
# Mailpit catches every email sent by SuiteCRM: a demo never writes to a real
# inbox. Inbox on https://mail-<APP_HOST>, behind a password (MAILPIT_PASSWORD
# in .env.local). One level only under the domain: the wildcard certificate
# covers *.david-grosskost.fr, not *.demo-core.david-grosskost.fr.

x-server-image: &server-image
  # No build on a server: only the image of the released version.
  build: !reset null
  image: ${APP_IMAGE:?APP_IMAGE manquant dans .env}:${APP_VERSION:?APP_VERSION manquant dans .env.local}
  # Same target as the app volume of compose.yaml, which it replaces.
  volumes:
    - ./data/app:/var/www/html

services:
  app:
    <<: *server-image
    environment:
      # Written to the database at install and at each start (scripts/mail.php):
      # the schedulers (campaigns, reminders) read it there too.
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      MAIL_FROM_ADDRESS: crm@${APP_HOST}
      # The admin password of .env.local opens one session only: SuiteCRM asks
      # for a new one at the first login (scripts/post-install.php).
      ADMIN_PASSWORD_ONCE: "1"

  cron:
    <<: *server-image

  db:
    volumes:
      - ./data/db:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: ${APP_SLUG}-mailpit
    restart: unless-stopped
    environment:
      # Web interface and API. Unique per instance: one demo's password never
      # opens another's inbox.
      MP_UI_AUTH: ${MAILPIT_USER:-demo}:${MAILPIT_PASSWORD:?MAILPIT_PASSWORD manquant dans .env.local}
    networks:
      - proxy
      - default
    labels:
      - traefik.enable=true
      - traefik.http.routers.${APP_SLUG}-mail.rule=Host(`mail-${APP_HOST}`)
      - traefik.http.routers.${APP_SLUG}-mail.entrypoints=websecure
      - traefik.http.services.${APP_SLUG}-mail.loadbalancer.server.port=8025
