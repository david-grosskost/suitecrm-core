# No Apache version or OS in the responses (Server header) nor in error pages.
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Caching of the front-end files (mod_headers, enabled by the Dockerfile).
    #
    # Apache sends no Cache-Control of its own: the browser is then free to
    # guess how long a file stays fresh, and it does. That is harmless for a
    # file whose name carries a fingerprint, since a new version comes with a
    # new name — but remoteEntry.js, the entry map of an extension's Angular
    # module, keeps its name from one version to the next. Cached, it goes on
    # naming the old files, so an instance keeps running the previous version
    # of an extension after an update, with nothing to show for it.
    <FilesMatch "remoteEntry\.js$">
        Header always set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    # A file whose name carries its fingerprint never changes under that name:
    # it is worth keeping for a year rather than asking for it again.
    <FilesMatch "\.[0-9a-f]{16,}\.(js|css)$">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>