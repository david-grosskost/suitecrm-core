# CI: the checks shared by every SuiteCRM project, from the devkit.
# Keep the version in step with suitecrm-devkit in composer.json.
# Pull requests only: main only receives merged pull requests whose checks
# passed (ruleset), so running them again after the merge would be redundant.
name: CI

on:
  pull_request:

jobs:
  checks:
    uses: david-grosskost/suitecrm-devkit/.github/workflows/checks.yml@v0.6.0
