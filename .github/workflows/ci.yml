# CI: the checks shared by every SuiteCRM project, from the devkit.
# Keep the version in step with suitecrm-devkit in composer.json.
# Pull requests only: main only receives merged pull requests whose checks
# passed (ruleset), so running them again after the merge would be redundant.
name: CI

on:
  pull_request:
    # edited: a corrected pull request title is checked again.
    types: [opened, synchronize, reopened, edited]

jobs:
  checks:
    uses: david-grosskost/suitecrm-devkit/.github/workflows/checks.yml@v0.29.0

  # The regression test (an instance with every extension, through the main
  # screens: make test@regression) is paused: each screen waits out a full
  # minute, locally and on GitHub, which costs more than it catches for now.
  # To be taken up again in chantier 8; it still runs by hand with
  # make test@regression.
  # regression:
  #   uses: david-grosskost/suitecrm-devkit/.github/workflows/regression.yml@v0.29.0
