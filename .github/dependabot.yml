# Opens a pull request when a newer version of a dependency is released, every
# week. Prefixes follow Conventional Commits (the pull request title becomes
# the commit on main, read by release-please):
# - fix(deps): what ends up in the image or on the server (Faker, Mailpit,
#   MariaDB), so that the update is released and deployed;
# - build(deps): development tools only, no release.
# suitecrm-devkit is left out: its version moves in composer.json and in the
# workflows together, by hand (see the workflows' comments).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: david-grosskost/suitecrm-devkit
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: fix
      prefix-development: build
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The database: its data files cannot go back to an older series, and
      # the newer series are often rolling (short support). Moved by hand,
      # from one LTS to the next, after a backup.
      - dependency-name: mariadb
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: fix
      include: scope
